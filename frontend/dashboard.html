<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Job Application Co-Pilot</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="page-wrapper">

<nav class="navbar">
  <a href="dashboard.html" class="navbar-brand">
    <div class="logo-icon"><i data-lucide="zap"></i></div>Co-Pilot
  </a>
  <div class="navbar-right">
    <span class="navbar-user" id="user-name-display"></span>
    <button class="btn btn-secondary btn-sm" id="logout-btn">Sign Out</button>
  </div>
</nav>

<main class="container" style="flex:1;">

  <div class="page-header">
    <div>
      <h1>My Applications</h1>
      <p>Track your job application pipeline</p>
    </div>
    <a href="new-application.html" class="btn btn-primary btn-lg">
      <i data-lucide="plus"></i> New Application
    </a>
  </div>

  <!-- Stats row -->
  <div class="dash-stats">
    <div class="stat-card stat-card-total">
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card stat-card-applied">
      <div class="stat-value" id="stat-applied">—</div>
      <div class="stat-label">Applied</div>
    </div>
    <div class="stat-card stat-card-interviewing">
      <div class="stat-value" id="stat-interviewing">—</div>
      <div class="stat-label">Interviewing</div>
    </div>
    <div class="stat-card stat-card-offers">
      <div class="stat-value" id="stat-offers">—</div>
      <div class="stat-label">Offers</div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="not_yet">Not Applied</button>
    <button class="filter-btn" data-filter="applied">Applied</button>
    <button class="filter-btn" data-filter="interviewed">Interviewing</button>
    <button class="filter-btn" data-filter="rejected">Rejected</button>
    <button class="filter-btn" data-filter="offer">Offers</button>
  </div>

  <!-- Empty state -->
  <div class="empty-state hidden" id="empty-state">
    <div class="empty-state-icon"><i data-lucide="clipboard-list"></i></div>
    <h3>No applications yet</h3>
    <p>Create your first application to get started</p>
    <a href="new-application.html" class="btn btn-primary" style="margin-top:20px;">
      <i data-lucide="plus"></i> New Application
    </a>
  </div>

  <!-- Applications grid (populated by JS) -->
  <div class="applications-grid" id="applications-grid"></div>

</main>

<script type="module">
  import { api, auth, requireAuth, toast, formatDate } from './js/api.js';

  requireAuth();

  const user = auth.getUser();
  if (user) document.getElementById('user-name-display').textContent =
    user.full_name || user.email;

  document.getElementById('logout-btn').addEventListener('click', () => {
    auth.clear();
    window.location.href = 'index.html';
  });

  let allApps = [], activeFilter = 'all';

  const STATUS_LABELS = {
    not_yet:    'Not Applied',
    applied:    'Applied',
    interviewed:'Interviewing',
    rejected:   'Rejected',
    offer:      'Offer',
  };

  async function loadApps() {
    try {
      allApps = await api.get('/applications/');
      document.getElementById('stat-total').textContent       = allApps.length;
      document.getElementById('stat-applied').textContent     = allApps.filter(a => a.status === 'applied').length;
      document.getElementById('stat-interviewing').textContent= allApps.filter(a => a.status === 'interviewed').length;
      document.getElementById('stat-offers').textContent      = allApps.filter(a => a.status === 'offer').length;
      renderApps();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  function renderApps() {
    const filtered = activeFilter === 'all'
      ? allApps
      : allApps.filter(a => a.status === activeFilter);

    const grid  = document.getElementById('applications-grid');
    const empty = document.getElementById('empty-state');

    if (!filtered.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden');
      lucide.createIcons();
      return;
    }
    empty.classList.add('hidden');

    grid.innerHTML = filtered.map(app => `
      <div class="app-card" onclick="location.href='application.html?id=${app.id}'">
        <div class="app-card-top">
          <div class="app-card-meta">
            <div class="app-company-logo">${(app.company || '?')[0].toUpperCase()}</div>
            <div class="app-card-info">
              <div class="app-card-title">${app.job_title}</div>
              <div class="app-card-company">${app.company}</div>
            </div>
          </div>
          <span class="badge badge-${app.status}">
            ${STATUS_LABELS[app.status] || app.status}
          </span>
        </div>
        <div class="app-card-footer">
          <span>${formatDate(app.created_at)}</span>
          <span class="kit-badge ${app.draft ? 'kit-badge-ready' : 'kit-badge-pending'}">
            ${app.draft
              ? '<i data-lucide="check-circle"></i> Kit ready'
              : '<i data-lucide="clock"></i> No kit yet'}
          </span>
        </div>
      </div>
    `).join('');

    lucide.createIcons();
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderApps();
    });
  });

  lucide.createIcons();
  loadApps();
</script>
</body>
</html>
