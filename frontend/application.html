<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application — Job Application Co-Pilot</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/config.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="page-wrapper">

<nav class="navbar">
  <a href="dashboard.html" class="navbar-brand">
    <div class="logo-icon"><i data-lucide="zap"></i></div>Co-Pilot
  </a>
  <div class="navbar-right">
    <a href="dashboard.html" class="btn btn-secondary btn-sm">
      <i data-lucide="arrow-left"></i> Dashboard
    </a>
  </div>
</nav>

<main class="container" style="flex:1; padding-top:32px; padding-bottom:60px;">

  <!-- Application header -->
  <div class="app-header">
    <div class="app-header-left">
      <div class="app-company-name" id="app-company"></div>
      <h1 id="app-job-title"></h1>
      <div class="app-header-status">
        <select id="status-select" class="status-select">
          <option value="not_yet">Not Applied</option>
          <option value="applied">Applied</option>
          <option value="interviewed">Interviewing</option>
          <option value="rejected">Rejected</option>
          <option value="offer">Offer Received</option>
        </select>
        <span id="status-saved" class="status-saved">
          <i data-lucide="check"></i> Saved
        </span>
      </div>
    </div>
    <button class="btn btn-danger btn-sm" id="delete-btn">
      <i data-lucide="trash-2"></i> Delete
    </button>
  </div>

  <!-- No-draft info banner -->
  <div id="no-draft-banner" class="info-banner hidden">
    <div>
      <div class="info-banner-title">AI kit not generated yet</div>
      <div class="info-banner-desc">Click "Generate Kit" to run all 4 agents (~20–30 seconds).</div>
    </div>
    <button class="btn btn-primary" id="generate-kit-btn">
      <i data-lucide="sparkles"></i> Generate Kit
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="fit">
      <i data-lucide="target"></i> Fit Analysis
    </button>
    <button class="tab-btn" data-tab="resume">
      <i data-lucide="file-text"></i> Resume
    </button>
    <button class="tab-btn" data-tab="cover">
      <i data-lucide="mail"></i> Cover Letter
    </button>
    <button class="tab-btn" data-tab="interview">
      <i data-lucide="mic"></i> Interview Prep
    </button>
  </div>

  <!-- TAB 1: Fit Analysis -->
  <div id="tab-fit" class="tab-panel">
    <div class="tab-header">
      <h3>Fit Analysis</h3>
      <div class="tab-header-actions">
        <button class="btn btn-secondary btn-sm" id="regen-fit">
          <i data-lucide="refresh-cw"></i> Regenerate
        </button>
      </div>
    </div>

    <div class="fit-layout">
      <!-- Score ring -->
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle class="score-ring-track" cx="60" cy="60" r="44"/>
            <circle class="score-ring-fill" id="score-ring" cx="60" cy="60" r="44"
                    stroke-dasharray="276.46" stroke-dashoffset="276.46"
                    transform="rotate(-90 60 60)"/>
          </svg>
          <div class="score-ring-text">
            <span class="score-number" id="score-text"></span>
          </div>
        </div>
        <span class="score-sublabel">match score</span>
      </div>

      <!-- Requirements breakdown -->
      <div class="fit-details">
        <div class="requirements-section">
          <div class="requirements-label match">
            <i data-lucide="check-circle"></i> You have these
          </div>
          <div class="pill-group" id="fit-matching"></div>
        </div>

        <div class="requirements-section">
          <div class="requirements-label gap">
            <i data-lucide="x-circle"></i> Gaps to address
          </div>
          <div class="pill-group" id="fit-missing"></div>
        </div>

        <p class="fit-summary" id="fit-summary"></p>

        <div id="fit-extra" class="fit-extra-section hidden">
          <div class="requirements-section">
            <div class="requirements-label skills">
              <i data-lucide="lightbulb"></i> Skills to emphasise
            </div>
            <div class="pill-group" id="fit-skills"></div>
          </div>
          <div class="requirements-section" style="margin-top:16px;">
            <div class="requirements-label keys">
              <i data-lucide="key"></i> Key JD keywords
            </div>
            <div class="pill-group" id="fit-keywords"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: Resume -->
  <div id="tab-resume" class="tab-panel hidden">
    <div class="tab-header">
      <h3>Rewritten Resume</h3>
      <div class="tab-header-actions">
        <button class="btn btn-secondary btn-sm" id="regen-resume">
          <i data-lucide="refresh-cw"></i> Regenerate
        </button>
        <button class="btn btn-primary btn-sm" id="download-resume">
          <i data-lucide="download"></i> Download .txt
        </button>
      </div>
    </div>
    <div class="diff-view" id="resume-diff"></div>
  </div>

  <!-- TAB 3: Cover Letter -->
  <div id="tab-cover" class="tab-panel hidden">
    <div class="tab-header">
      <h3>Cover Letter</h3>
      <div class="tab-header-actions">
        <button class="btn btn-secondary btn-sm" id="regen-cover">
          <i data-lucide="refresh-cw"></i> Regenerate
        </button>
        <button class="btn btn-primary btn-sm" id="download-docx">
          <i data-lucide="download"></i> Download .docx
        </button>
      </div>
    </div>
    <div class="cover-letter-body" id="cover-letter-text"></div>
  </div>

  <!-- TAB 4: Interview Prep -->
  <div id="tab-interview" class="tab-panel hidden">
    <div class="tab-header">
      <h3>Interview Prep — 10 Questions</h3>
      <div class="tab-header-actions">
        <button class="btn btn-secondary btn-sm" id="regen-interview">
          <i data-lucide="refresh-cw"></i> Regenerate
        </button>
      </div>
    </div>
    <div class="interview-list" id="interview-accordion"></div>
  </div>

</main>

<script type="module">
  import { api, auth, requireAuth, toast } from './js/api.js';
  requireAuth();

  const params = new URLSearchParams(window.location.search);
  const appId  = params.get('id');
  if (!appId) window.location.href = 'dashboard.html';

  let appData = null;

  // ── Load application ──────────────────────────────────────────────────────
  async function loadApp() {
    try {
      appData = await api.get(`/applications/${appId}`);
      document.getElementById('app-company').textContent   = appData.company;
      document.getElementById('app-job-title').textContent = appData.job_title;
      document.getElementById('status-select').value       = appData.status;

      if (appData.draft) {
        renderAllTabs(appData.draft);
        document.getElementById('no-draft-banner').classList.add('hidden');
      } else {
        document.getElementById('no-draft-banner').classList.remove('hidden');
      }
    } catch (err) {
      toast(err.message, 'error');
    }
    lucide.createIcons();
  }

  // ── Status dropdown ───────────────────────────────────────────────────────
  document.getElementById('status-select').addEventListener('change', async (e) => {
    try {
      await api.patch(`/applications/${appId}/status`, { status: e.target.value });
      const el = document.getElementById('status-saved');
      el.style.opacity = '1';
      setTimeout(() => el.style.opacity = '0', 2000);
    } catch (err) { toast(err.message, 'error'); }
  });

  // ── Delete ────────────────────────────────────────────────────────────────
  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Delete this application? This cannot be undone.')) return;
    try {
      await api.delete(`/applications/${appId}`);
      window.location.href = 'dashboard.html';
    } catch (err) { toast(err.message, 'error'); }
  });

  // ── Tab switching ─────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('hidden');
    });
  });

  // ── Render all artifact tabs ──────────────────────────────────────────────
  function renderAllTabs(draft) {
    if (draft.fit_analysis   && typeof draft.fit_analysis   === 'string') draft.fit_analysis   = JSON.parse(draft.fit_analysis);
    if (draft.resume_rewrite && typeof draft.resume_rewrite === 'string') draft.resume_rewrite = JSON.parse(draft.resume_rewrite);
    if (draft.interview_qa   && typeof draft.interview_qa   === 'string') draft.interview_qa   = JSON.parse(draft.interview_qa);

    if (draft.fit_analysis)  renderFit(draft.fit_analysis);
    if (draft.resume_rewrite) renderResume(draft.resume_rewrite);
    if (draft.cover_letter)  renderCoverLetter(draft.cover_letter);
    if (draft.interview_qa)  renderInterview(draft.interview_qa);
  }

  // ── Tab 1: Fit Analysis ───────────────────────────────────────────────────
  function renderFit(fit) {
    const score = fit.match_score || 0;
    const circumference = 276.46;
    const offset = circumference * (1 - score / 100);
    const ring = document.getElementById('score-ring');
    setTimeout(() => ring.style.strokeDashoffset = offset, 100);
    ring.style.stroke = score >= 70 ? '#10b981' : score >= 45 ? '#f59e0b' : '#ef4444';
    document.getElementById('score-text').textContent = score + '%';

    document.getElementById('fit-matching').innerHTML =
      (fit.matching_requirements || []).map(r =>
        `<span class="pill pill-success">${r}</span>`
      ).join('');

    document.getElementById('fit-missing').innerHTML =
      (fit.missing_requirements || []).map(r =>
        `<span class="pill pill-danger">${r}</span>`
      ).join('');

    document.getElementById('fit-summary').textContent = fit.overall_summary || '';

    const skills   = fit.skills_to_emphasize || [];
    const keywords = fit.key_keywords || [];
    if (skills.length || keywords.length) {
      document.getElementById('fit-extra').classList.remove('hidden');
      document.getElementById('fit-skills').innerHTML = skills.map(s =>
        `<span class="pill pill-primary">${s}</span>`
      ).join('');
      document.getElementById('fit-keywords').innerHTML = keywords.map(k =>
        `<span class="pill pill-purple">${k}</span>`
      ).join('');
    }
  }

  // ── Tab 2: Resume ─────────────────────────────────────────────────────────
  function renderResume(rewrite) {
    const container = document.getElementById('resume-diff');
    const changes   = rewrite.changes || [];
    container.innerHTML = changes.map(c => `
      <div class="diff-row">
        <div class="diff-cell del">${c.original}</div>
        <div class="diff-cell add">${c.rewritten}</div>
      </div>
    `).join('');
  }

  // ── Tab 3: Cover Letter ───────────────────────────────────────────────────
  function renderCoverLetter(cl) {
    document.getElementById('cover-letter-text').textContent = cl || '';
  }

  document.getElementById('download-docx').addEventListener('click', async () => {
    try {
      const blob = await api.getBlob(`/applications/${appId}/download/cover-letter`);
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `cover-letter-${appId}.docx`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) { toast(err.message, 'error'); }
  });

  document.getElementById('download-resume').addEventListener('click', async () => {
    try {
      const blob = await api.getBlob(`/applications/${appId}/download/resume`);
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `resume-${appId}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) { toast(err.message, 'error'); }
  });

  // ── Tab 4: Interview Prep ─────────────────────────────────────────────────
  function renderInterview(prep) {
    const questions = Array.isArray(prep) ? prep : (prep.questions || []);
    const container = document.getElementById('interview-accordion');

    const typeClass = { behavioral: 'type-behavioral', technical: 'type-technical', situational: 'type-situational' };

    container.innerHTML = questions.map((q, i) => `
      <div class="interview-card" id="icard-${i}">
        <button class="interview-card-header" onclick="toggleCard(${i})">
          <span class="interview-type-badge ${typeClass[q.type] || 'type-behavioral'}">${q.type}</span>
          <span class="interview-question">${q.question}</span>
          <span class="interview-chevron"><i data-lucide="chevron-down"></i></span>
        </button>
        <div class="interview-card-body">
          <div class="interview-answer-label">Sample Answer</div>
          <p class="interview-answer">${q.sample_answer}</p>
          <div class="tip-box">
            <div class="tip-box-label"><i data-lucide="lightbulb"></i> Tip</div>
            <p class="tip-box-text">${q.tip}</p>
          </div>
        </div>
      </div>
    `).join('');

    lucide.createIcons();
  }

  window.toggleCard = function(i) {
    document.getElementById(`icard-${i}`).classList.toggle('open');
  };

  // ── Regenerate ────────────────────────────────────────────────────────────
  const SECTION_FIELD = {
    fit_analysis: 'fit_analysis',
    resume:       'resume_rewrite',
    cover_letter: 'cover_letter',
    interview:    'interview_qa',
  };

  async function regenerate(section, renderFn) {
    try {
      toast('Regenerating…', 'info');
      const data  = await api.post(`/applications/${appId}/regenerate/${section}`, {});
      const field = SECTION_FIELD[section];
      let value   = data.draft ? data.draft[field] : null;
      if ((field === 'fit_analysis' || field === 'resume_rewrite' || field === 'interview_qa')
          && typeof value === 'string') {
        value = JSON.parse(value);
      }
      if (value) renderFn(value);
      toast('Regenerated!', 'success');
    } catch (err) { toast(err.message, 'error'); }
  }

  document.getElementById('regen-fit').addEventListener('click',
    () => regenerate('fit_analysis', renderFit));
  document.getElementById('regen-resume').addEventListener('click',
    () => regenerate('resume', renderResume));
  document.getElementById('regen-cover').addEventListener('click',
    () => regenerate('cover_letter', renderCoverLetter));
  document.getElementById('regen-interview').addEventListener('click',
    () => regenerate('interview', renderInterview));

  // ── Generate Kit button ───────────────────────────────────────────────────
  document.getElementById('generate-kit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('generate-kit-btn');
    btn.disabled  = true;
    btn.innerHTML = '<span class="spinner"></span> Running agents…';
    try {
      await api.post(`/applications/${appId}/generate`, {});
      appData = await api.get(`/applications/${appId}`);
      if (appData.draft) {
        renderAllTabs(appData.draft);
        document.getElementById('no-draft-banner').classList.add('hidden');
        toast('Kit generated!', 'success');
      }
    } catch (err) {
      toast(err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="sparkles"></i> Generate Kit';
      lucide.createIcons();
    }
  });

  lucide.createIcons();
  loadApp();
</script>
</body>
</html>
